<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Get Tee Wars</title><meta name="description" content="Get Tee Wars, the golf game where every hole is up for grabs, on iPhone and Android.">
<link rel="preconnect" href="https://fonts.googleapis.com"><link href="https://fonts.googleapis.com/css2?family=Luckiest+Guy&family=Lilita+One&family=Inter:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0b1033;--panel:#141a46;--ink:#e9ecf8;--dim:#a9b3d6;--gold:#ffd45a;--pink:#e8358f;--line:#2a3370}
*{box-sizing:border-box}html,body{margin:0}
body{background:radial-gradient(ellipse 120% 60% at 50% 0%,#2a1450,var(--bg) 60%) fixed,var(--bg);color:var(--ink);font:16px/1.65 Inter,system-ui,sans-serif}
header{padding:28px 16px 8px;text-align:center}
.logo{font-family:'Luckiest Guy',sans-serif;font-size:clamp(40px,9vw,64px);letter-spacing:1px;line-height:1;margin:0;color:#fff;-webkit-text-stroke:2px #05070b;text-shadow:0 4px 0 #05070b}
.logo span{color:var(--gold)}
nav{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:16px 0 0}
nav a{font-family:'Lilita One',sans-serif;color:var(--ink);text-decoration:none;padding:6px 14px;border-radius:999px;border:2px solid var(--line);background:var(--panel)}
nav a[aria-current]{background:var(--gold);color:#3a1d00;border-color:#05070b}
main{max-width:760px;margin:20px auto 40px;padding:0 16px}
.card{background:var(--panel);border:2px solid var(--line);border-radius:18px;padding:22px clamp(16px,4vw,32px)}
h1{font-family:'Lilita One',sans-serif;font-size:30px;margin:0 0 4px;color:var(--gold)}
h2{font-family:'Lilita One',sans-serif;font-size:21px;margin:26px 0 6px;color:#fff}
.meta{color:var(--dim);font-size:14px;margin:0 0 12px}
a{color:#8be9ff}ul{padding-left:20px}li{margin:4px 0}
.btn{display:inline-block;font-family:'Lilita One',sans-serif;font-size:18px;padding:10px 18px;border-radius:12px;background:var(--gold);color:#3a1d00;text-decoration:none;border:2px solid #05070b;margin:4px 6px 4px 0}
.btn.alt{background:var(--pink);color:#fff}
footer{text-align:center;color:var(--dim);font-size:13px;padding:0 16px 32px}
</style></head><body>
<header><p class="logo">TEE <span>WARS</span></p>
<nav><a href="index.html">Support</a><a href="privacy.html">Privacy</a><a href="terms.html">Terms</a><a href="press.html">Press</a></nav></header>
<main><div class="card"><h1>Get Tee Wars</h1>
<p class="meta">Golf where every hole is up for grabs.</p>
<div id="go"><p><b>Coming soon to iPhone and Android.</b> Be first in: join the Discord for the beta and the launch day.</p></div>
<p id="btns"><a class="btn alt" href="https://discord.gg/4DK3RSXCF">Join the Discord</a></p>
<script>
(function () {
  var released = false;
  var src = ((new URLSearchParams(location.search)).get('src') || 'web').replace(/[^A-Za-z0-9_]/g, '').slice(0, 40).toLowerCase() || 'web';
  var pt = '129176837';
  var ios = 'https://apps.apple.com/app/apple-store/id6821496495?' + (pt ? 'pt=' + pt + '&' : '') + 'ct=' + src + '&mt=8';
  var play = 'https://play.google.com/store/apps/details?id=com.buzzworthygames.teewars&referrer='
    + encodeURIComponent('utm_source=' + src + '&utm_medium=social&utm_campaign=launch');
  if (!released) return;
  var ua = navigator.userAgent || '';
  var isIos = /iPhone|iPad|iPod/i.test(ua) || (/Macintosh/.test(ua) && navigator.maxTouchPoints > 1);
  if (isIos) { location.replace(ios); return; }
  if (/Android/i.test(ua)) { location.replace(play); return; }
  document.getElementById('go').innerHTML = '<p>On your phone? Pick your store:</p>';
  document.getElementById('btns').innerHTML = '<a class="btn" href="' + ios + '">App Store</a><a class="btn" href="' + play + '">Google Play</a>';
})();
</script></div></main><footer>© 2026 Buzzworthy Games LLC, an Arizona limited liability company · <a href="mailto:hello@buzzworthy.games">hello@buzzworthy.games</a></footer></body></html>
